<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Captions</title>
<style>
  :root {
    --size: 24px;
    --color: #f2f2f2;
    --bg: #000000;
    --dim: #8b8b8b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--color);
    -webkit-text-size-adjust: 100%;
  }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
  }

  /* Connection state, deliberately almost invisible: a hairline at the top
     edge. Amber while the link is down. The phone view may hint; the wall
     view may not. */
  #link {
    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 5;
    background: transparent; transition: background 400ms linear;
  }
  #link.down { background: #b8860b; }

  #scroll {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding:
      calc(env(safe-area-inset-top) + 18px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 26px)
      calc(env(safe-area-inset-left) + 18px);
  }

  #lines > div {
    font-size: var(--size);
    line-height: 1.45;
    margin: 0 0 0.75em 0;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  #lines > div.new { animation: fadein 260ms ease-out; }
  @keyframes fadein { from { opacity: 0.35; } to { opacity: 1; } }

  #interim {
    font-size: var(--size);
    line-height: 1.45;
    color: var(--dim);
    word-wrap: break-word;
    overflow-wrap: break-word;
    min-height: 1.45em;
  }

  #latest {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 22px);
    z-index: 6;
    padding: 12px 20px;
    border-radius: 999px;
    background: #2a2a2a; color: #fff; border: 1px solid #454545;
    font-size: 16px; font-family: inherit;
    display: none;
  }
  #latest.on { display: block; }

  /* Settings trigger. One 44px target, low contrast, bottom right - the
     only thing visible on the page until someone taps it. */
  #settings-btn {
    position: fixed;
    right: calc(env(safe-area-inset-right) + 14px);
    bottom: calc(env(safe-area-inset-bottom) + 14px);
    z-index: 7;
    width: 44px; height: 44px; border-radius: 22px;
    background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.42);
    border: 0; font-family: inherit; font-size: 15px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  #settings-btn.open { background: rgba(255,255,255,0.16); color: rgba(255,255,255,0.75); }

  /* Language switcher. Hidden unless the relay is actually translating into
     more than one language - offering a choice that does nothing is worse
     than no choice at all. */
  #lang {
    position: fixed;
    right: calc(env(safe-area-inset-right) + 66px);
    bottom: calc(env(safe-area-inset-bottom) + 14px);
    z-index: 6;
    height: 44px; padding: 0 14px; border-radius: 22px;
    background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.55);
    border: 0; font-family: inherit; font-size: 15px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
    display: none;
  }
  #lang.on { display: block; }

  /* Settings panel: a small card anchored above the trigger, not a
     full-screen takeover - captions keep scrolling behind it. Width is
     clamped so it never overflows a narrow phone, and never sprawls on a
     desktop monitor either. */
  #settings {
    position: fixed;
    right: calc(env(safe-area-inset-right) + 10px);
    bottom: calc(env(safe-area-inset-bottom) + 66px);
    z-index: 7;
    width: min(300px, calc(100vw - 20px));
    background: #1c1c1c;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    display: none;
    font-size: 15px;
  }
  #settings.open { display: block; }
  #settings .row { margin-bottom: 16px; }
  #settings .row:last-child { margin-bottom: 0; }
  #settings .label {
    color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 9px;
  }
  #settings .size-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #settings .size-btn {
    width: 42px; height: 42px; border-radius: 10px; flex: none;
    background: rgba(255,255,255,0.09); color: #fff; border: 0;
    font-family: inherit; -webkit-tap-highlight-color: transparent;
  }
  #settings .size-btn:active:not(:disabled) { background: rgba(255,255,255,0.18); }
  #settings .size-btn:disabled { opacity: 0.3; }
  #size-dec { font-size: 13px; }
  #size-inc { font-size: 20px; }
  #size-value {
    flex: 1; text-align: center; color: rgba(255,255,255,0.75); font-size: 14px;
  }
  #settings .swatches {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #settings .swatch {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    border: 0; padding: 0; -webkit-tap-highlight-color: transparent;
  }
  /* A dark gap before the ring, not just a border, so a white or pale
     swatch's selection state is still visible against a pale swatch. */
  #settings .swatch.selected {
    box-shadow: 0 0 0 3px #1c1c1c, 0 0 0 5px rgba(255,255,255,0.9);
  }
  #settings .swatch-custom {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    border: 0; padding: 0; background: transparent; cursor: pointer;
  }
  #settings .swatch-custom::-webkit-color-swatch-wrapper { padding: 0; border-radius: 50%; }
  #settings .swatch-custom::-webkit-color-swatch { border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }
  #settings .swatch-custom::-moz-color-swatch { border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; }

  #dbg {
    position: fixed; top: 6px; left: 6px; z-index: 9;
    font: 11px/1.4 Menlo, Consolas, monospace;
    color: #0f0; background: rgba(0,0,0,0.85);
    padding: 5px 7px; white-space: pre; display: none; pointer-events: none;
  }
  #dbg.on { display: block; }
</style>
</head>
<body>
<div id="link"></div>
<div id="scroll">
  <div id="lines"></div>
  <div id="interim"></div>
</div>
<button id="latest" type="button">Jump to latest</button>
<button id="lang" type="button" aria-label="Language"></button>
<button id="settings-btn" type="button" aria-label="Caption display settings"
        aria-expanded="false" aria-controls="settings">Aa</button>
<div id="settings" role="group" aria-label="Caption display settings">
  <div class="row">
    <div class="label">Text size</div>
    <div class="size-row">
      <button id="size-dec" class="size-btn" type="button" aria-label="Smaller text">A</button>
      <span id="size-value">24px</span>
      <button id="size-inc" class="size-btn" type="button" aria-label="Larger text">A</button>
    </div>
  </div>
  <div class="row">
    <div class="label">Text color</div>
    <div class="swatches" id="swatches">
      <button class="swatch" type="button" data-color="#f2f2f2" style="background:#f2f2f2" aria-label="White"></button>
      <button class="swatch" type="button" data-color="#ffd54a" style="background:#ffd54a" aria-label="Amber"></button>
      <button class="swatch" type="button" data-color="#8ee08a" style="background:#8ee08a" aria-label="Green"></button>
      <button class="swatch" type="button" data-color="#8ab4ff" style="background:#8ab4ff" aria-label="Blue"></button>
      <button class="swatch" type="button" data-color="#ff9b9b" style="background:#ff9b9b" aria-label="Red"></button>
      <input id="color-custom" class="swatch-custom" type="color" aria-label="Custom color">
    </div>
  </div>
</div>
<div id="dbg"></div>
<script>
(function () {
  'use strict';

  var P, cfg, elScroll, elLines, elInterim, elLatest, elLang, elLink, elDbg;
  var elSettings, elSettingsBtn, elSizeDec, elSizeInc, elSizeValue, elSwatches, elColorCustom;
  var sock = null, reconnTimer = null, attempts = 0, lastDelay = 0;
  var sessionId = null, lastSeq = -1, msgCount = 0, lastMsgAt = 0, startedAt = 0;
  var seenIds = Object.create(null), seenOrder = [], pinned = true, lineCount = 0;
  var SIZES = [19, 22, 26, 31, 37];
  var chosenLang = '', availableLangs = [];

  // Endonyms: someone looking for their language should see it written the
  // way they write it, not translated into English.
  var LANG_NAMES = {
    en: 'English', es: 'Espanol', pt: 'Portugues', fr: 'Francais',
    de: 'Deutsch', it: 'Italiano', ko: '한국어',
    ja: '日本語', ar: 'العربية',
    zh: '中文', 'zh-Hans': '简体中文',
    'zh-Hant': '繁體中文', vi: 'Tieng Viet', ru: 'Русский'
  };
  function langLabel(code) { return LANG_NAMES[code] || code; }

  function now() { return Date.now(); }
  function log() {
    try { console.log.apply(console, ['[phone]'].concat([].slice.call(arguments))); } catch (e) {}
  }

  function num(key, dflt, lo, hi) {
    var v = parseFloat(P.get(key));
    if (!isFinite(v)) return dflt;
    return v < lo ? lo : (v > hi ? hi : v);
  }
  function hex(key, dflt) {
    var v = (P.get(key) || '').replace(/^#/, '');
    return /^([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v) ? ('#' + v) : dflt;
  }
  function flag(key) {
    var v = P.get(key);
    return v !== null && v !== '' && v !== '0' && v !== 'false' && v !== 'no';
  }

  function readConfig() {
    return {
      size:  num('size', 24, 12, 64),           // px - phones are read at arm's length
      color: hex('color', '#f2f2f2'),
      bg:    hex('bg', '#000000'),
      lines: Math.round(num('lines', 200, 10, 2000)),  // scrollback cap, bounded DOM
      debug: flag('debug'),
      relay: P.get('relay'),
      lang: P.get('lang') || ''
    };
  }

  // ---- text size, remembered per device ----------------------------------

  function loadSize() {
    try {
      var s = parseFloat(localStorage.getItem('cc.size'));
      if (isFinite(s) && s >= 12 && s <= 64) return s;
    } catch (e) {}
    return cfg.size;
  }
  function setSize(px) {
    document.documentElement.style.setProperty('--size', px + 'px');
    try { localStorage.setItem('cc.size', String(px)); } catch (e) {}
    if (elSizeValue) elSizeValue.textContent = Math.round(px) + 'px';
    if (elSizeDec) elSizeDec.disabled = px <= SIZES[0];
    if (elSizeInc) elSizeInc.disabled = px >= SIZES[SIZES.length - 1];
  }
  function closestSizeIndex(px) {
    var best = 0, i;
    for (i = 0; i < SIZES.length; i++) {
      if (Math.abs(SIZES[i] - px) < Math.abs(SIZES[best] - px)) best = i;
    }
    return best;
  }
  function stepSize(delta) {
    var cur = parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue('--size')) || cfg.size;
    var next = closestSizeIndex(cur) + delta;
    if (next < 0 || next >= SIZES.length) return;
    var wasPinned = pinned;
    setSize(SIZES[next]);
    if (wasPinned) scrollToBottom();
  }

  // ---- text color, remembered per device ----------------------------------

  function loadColor() {
    try {
      var c = localStorage.getItem('cc.color');
      if (/^#[0-9a-fA-F]{6}$/.test(c || '')) return c;
    } catch (e) {}
    return cfg.color;
  }
  function setColor(hexColor) {
    document.documentElement.style.setProperty('--color', hexColor);
    try { localStorage.setItem('cc.color', hexColor); } catch (e) {}
    markSelectedSwatch(hexColor);
  }
  function markSelectedSwatch(hexColor) {
    var swatches = elSwatches ? elSwatches.querySelectorAll('.swatch') : [];
    for (var i = 0; i < swatches.length; i++) {
      swatches[i].classList.toggle('selected',
        swatches[i].getAttribute('data-color').toLowerCase() === hexColor.toLowerCase());
    }
    if (elColorCustom) elColorCustom.value = hexColor;
  }

  // ---- language ------------------------------------------------------------

  function loadLang() {
    if (cfg.lang) return cfg.lang;
    try { return localStorage.getItem('cc.lang') || ''; } catch (e) { return ''; }
  }

  function setLang(code) {
    if (code === chosenLang) return;
    chosenLang = code;
    try { localStorage.setItem('cc.lang', code); } catch (e) {}
    elLang.textContent = langLabel(code);
    // A different language is a different stream, so start clean and let the
    // relay replay that language's history on reconnect. teardown() schedules
    // that reconnect itself.
    resetAll();
    teardown();
  }

  function cycleLang() {
    if (availableLangs.length < 2) return;
    var i = availableLangs.indexOf(chosenLang);
    setLang(availableLangs[(i + 1) % availableLangs.length]);
  }

  function loadLanguages() {
    fetch('/api/site')
      .then(function (r) { return r.json(); })
      .then(function (site) {
        availableLangs = site.available || [];
        if (!chosenLang || availableLangs.indexOf(chosenLang) < 0) {
          chosenLang = site.source || 'en';
        }
        elLang.textContent = langLabel(chosenLang);
        // Only show the control when there is a real choice. One language
        // means the button would do nothing, so it stays hidden.
        elLang.className = availableLangs.length > 1 ? 'on' : '';
      })['catch'](function () {});
  }

  // ---- settings panel -----------------------------------------------------

  function openSettings() {
    elSettings.classList.add('open');
    elSettingsBtn.classList.add('open');
    elSettingsBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSettings() {
    elSettings.classList.remove('open');
    elSettingsBtn.classList.remove('open');
    elSettingsBtn.setAttribute('aria-expanded', 'false');
  }
  function toggleSettings() {
    if (elSettings.classList.contains('open')) closeSettings();
    else openSettings();
  }

  // ---- scroll ------------------------------------------------------------

  function atBottom() {
    return (elScroll.scrollHeight - elScroll.scrollTop - elScroll.clientHeight) < 90;
  }
  function scrollToBottom() {
    elScroll.scrollTop = elScroll.scrollHeight;
    pinned = true;
    elLatest.className = '';
  }
  function onScroll() {
    pinned = atBottom();
    elLatest.className = pinned ? '' : 'on';
  }

  // ---- render ------------------------------------------------------------

  function addLine(text, isReplay) {
    var d = document.createElement('div');
    d.textContent = text;
    if (!isReplay) d.className = 'new';
    elLines.appendChild(d);
    lineCount++;
    // Bounded DOM: an all-day service must not grow without limit.
    while (elLines.childNodes.length > cfg.lines) {
      elLines.removeChild(elLines.firstChild);
    }
    if (pinned) scrollToBottom();
    else elLatest.className = 'on';
  }

  function setInterimText(text) {
    elInterim.textContent = text || '';
    if (pinned) scrollToBottom();
  }

  function resetAll() {
    while (elLines.firstChild) elLines.removeChild(elLines.firstChild);
    setInterimText('');
    seenIds = Object.create(null);
    seenOrder.length = 0;
    lineCount = 0;
    scrollToBottom();
  }

  // Dedupe committed lines across reconnects, with a bounded id table.
  function seen(id) {
    if (!id) return false;
    if (seenIds[id]) return true;
    seenIds[id] = 1;
    seenOrder.push(id);
    if (seenOrder.length > 600) {
      var drop = seenOrder.splice(0, 300);
      for (var i = 0; i < drop.length; i++) delete seenIds[drop[i]];
    }
    return false;
  }

  // ---- websocket ---------------------------------------------------------

  function wsUrl() {
    var host = cfg.relay || location.host;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    if (!host) { host = 'localhost:8000'; proto = 'ws:'; }
    var url = proto + '//' + host + '/ws/viewer?role=phone';
    if (chosenLang) url += '&lang=' + encodeURIComponent(chosenLang);
    return url;
  }

  function setLink(up) {
    elLink.className = up ? '' : 'down';
  }

  function connect() {
    log('connect', wsUrl(), 'attempt', attempts);
    try {
      sock = new WebSocket(wsUrl());
    } catch (e) {
      sock = null;
      scheduleReconnect();
      return;
    }
    sock.onopen = function () {
      attempts = 0;
      lastMsgAt = now();
      setLink(true);
      log('open');
    };
    sock.onmessage = onMessage;
    sock.onclose = teardown;
    sock.onerror = teardown;
  }

  function teardown() {
    if (sock) {
      sock.onopen = sock.onmessage = sock.onclose = sock.onerror = null;
      try { sock.close(); } catch (e) {}
      sock = null;
    }
    setLink(false);
    setInterimText('');        // an in-progress line is not trustworthy once the link drops
    scheduleReconnect();
  }

  function scheduleReconnect() {
    if (reconnTimer) return;
    attempts++;
    var base = Math.min(10000, 500 * Math.pow(2, Math.min(attempts, 6)));
    lastDelay = Math.round(base * (0.75 + Math.random() * 0.5));
    reconnTimer = setTimeout(function () {
      reconnTimer = null;
      connect();
    }, lastDelay);
  }

  function onMessage(ev) {
    lastMsgAt = now();
    msgCount++;
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (!m || typeof m.type !== 'string') return;

    if (m.type === 'hello') {
      if (sessionId && m.session_id !== sessionId) {
        log('new session', m.session_id, '- clearing scrollback');
        resetAll();
      }
      sessionId = m.session_id || null;
      lastSeq = -1;
      return;
    }
    if (typeof m.seq === 'number') {
      if (m.seq <= lastSeq) return;
      lastSeq = m.seq;
    }
    switch (m.type) {
      case 'interim':
        setInterimText(m.text || '');
        break;
      case 'final':
        if (seen(m.id)) { setInterimText(''); break; }
        if (m.text) addLine(m.text, !!m.replay);
        setInterimText('');
        break;
      case 'clear':
        resetAll();
        break;
      case 'heartbeat':
        if (m.session_id && sessionId && m.session_id !== sessionId) {
          sessionId = m.session_id;
          resetAll();
        }
        break;
      default: break;
    }
  }

  // ---- screen wake -------------------------------------------------------
  // Phones sleeping mid-service is the top complaint about a view like this.
  // Best effort, silent if unsupported.

  var wakeLock = null;
  function requestWake() {
    try {
      if (!navigator.wakeLock || wakeLock) return;
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      })['catch'](function () {});
    } catch (e) {}
  }

  // ---- single timer ------------------------------------------------------

  var WS_NAMES = ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'];
  function tick() {
    var n = now();
    if (sock && sock.readyState === 1 && (n - lastMsgAt) > 20000) {
      // Heartbeats are every 5s; 20s of silence means the link is dead even
      // though the socket has not noticed yet.
      log('stale link, forcing reconnect');
      teardown();
    }
    if (cfg.debug) {
      elDbg.textContent =
        'ws       ' + (sock ? WS_NAMES[sock.readyState] : 'none') + '\n' +
        'session  ' + (sessionId || '-') + '\n' +
        'seq      ' + lastSeq + '  msgs ' + msgCount + '\n' +
        'last     ' + ((n - lastMsgAt) / 1000).toFixed(1) + 's ago\n' +
        'lines    ' + elLines.childNodes.length + '/' + cfg.lines +
          '  total ' + lineCount + '\n' +
        'pinned   ' + pinned + '  attempts ' + attempts + '\n' +
        'uptime   ' + ((n - startedAt) / 1000).toFixed(0) + 's';
    }
  }

  // ---- boot --------------------------------------------------------------

  function boot() {
    P = new URLSearchParams(location.search);
    cfg = readConfig();
    elScroll = document.getElementById('scroll');
    elLines = document.getElementById('lines');
    elInterim = document.getElementById('interim');
    elLatest = document.getElementById('latest');
    elLang = document.getElementById('lang');
    elLink = document.getElementById('link');
    elDbg = document.getElementById('dbg');
    elSettings = document.getElementById('settings');
    elSettingsBtn = document.getElementById('settings-btn');
    elSizeDec = document.getElementById('size-dec');
    elSizeInc = document.getElementById('size-inc');
    elSizeValue = document.getElementById('size-value');
    elSwatches = document.getElementById('swatches');
    elColorCustom = document.getElementById('color-custom');

    document.documentElement.style.setProperty('--bg', cfg.bg);
    setSize(loadSize());
    setColor(loadColor());
    if (cfg.debug) elDbg.className = 'on';

    elScroll.addEventListener('scroll', onScroll, { passive: true });
    elLatest.addEventListener('click', scrollToBottom);
    elLang.addEventListener('click', cycleLang);
    elSettingsBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleSettings();
    });
    elSizeDec.addEventListener('click', function () { stepSize(-1); });
    elSizeInc.addEventListener('click', function () { stepSize(1); });
    elSwatches.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.swatch') : null;
      if (btn) setColor(btn.getAttribute('data-color'));
    });
    elColorCustom.addEventListener('input', function () { setColor(this.value); });
    // Tapping anywhere else, or Escape, closes the panel - it should feel
    // like a lightweight popover, not a screen you have to explicitly exit.
    document.addEventListener('click', function (e) {
      if (elSettings.classList.contains('open') &&
          !elSettings.contains(e.target) && e.target !== elSettingsBtn) {
        closeSettings();
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSettings();
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { requestWake(); if (pinned) scrollToBottom(); }
    });

    startedAt = lastMsgAt = now();
    chosenLang = loadLang();
    loadLanguages();
    setLink(false);
    requestWake();
    connect();
    setInterval(tick, 1000);
    log('booted', cfg);
  }

  try {
    boot();
  } catch (e) {
    try { console.error('[phone] boot failed', e); } catch (e2) {}
  }
})();
</script>
</body>
</html>
