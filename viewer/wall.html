<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captions</title>
<style>
  /* Self-hosted, like everything else this page loads. */
  @font-face {
    font-family: "Atkinson Hyperlegible";
    src: url("/fonts/AtkinsonHyperlegible-Regular.ttf") format("truetype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Atkinson Hyperlegible";
    src: url("/fonts/AtkinsonHyperlegible-Bold.ttf") format("truetype");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root {
    --size: 6.5vh;
    --lh: 1.28;
    --color: #ffffff;
    --bar: rgba(0,0,0,0.85);
    --pad: 2vh;
    --radius: 1.5vh;
    --width: 86vw;
    --bottom: 9vh;
    --fade: 600ms;
    --font-family: "Helvetica Neue", Helvetica, Arial, "Segoe UI", system-ui, sans-serif;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  body { cursor: none; -webkit-user-select: none; user-select: none; }

  #bar {
    position: fixed;
    left: 50%;
    bottom: var(--bottom);
    width: var(--width);
    box-sizing: border-box;
    padding: var(--pad) calc(var(--pad) * 1.4);
    background: var(--bar);
    border-radius: var(--radius);
    transform: translateX(-50%) translateZ(0);
    opacity: 0;
    transition: opacity var(--fade) linear;
    will-change: opacity;
  }
  /* In fast, out slow: the first words after a pause must not ramp up from
     invisible, but a bar that vanishes abruptly looks like a fault. */
  #bar.on { opacity: 1; transition-duration: 80ms; }

  .line {
    display: block;
    height: calc(var(--size) * var(--lh));
    line-height: calc(var(--size) * var(--lh));
    font-size: var(--size);
    font-family: var(--font-family);
    font-weight: 600;
    color: var(--color);
    /* Left by default, like broadcast roll-up captions: a centred live row
       moves both ends on every word. ?align=center for the old look, or
       ?align=right. */
    text-align: var(--align, left);
    white-space: nowrap;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    /* Always an edge: whatever the operator does to the bar opacity, the
       glyphs keep a dark outline against bright video. */
    text-shadow: 0 0 0.06em rgba(0,0,0,0.9), 0 0.04em 0.12em rgba(0,0,0,0.9);
  }

  /* One short line, bottom corner, for the states a hearing audience never
     needs and a deaf audience cannot do without: reconnecting, paused, a
     fault. Off with ?nostatus=1 for a venue that insists on a clean layer. */
  #status {
    position: fixed; right: 2vw; bottom: 2vh; max-width: 70vw;
    padding: 0.8vh 1.8vh; border-radius: 1vh;
    background: rgba(0,0,0,0.85); color: #ffffff;
    font: 600 2.6vh/1.3 var(--font-family);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity 300ms linear;
  }
  #status.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    #bar, #status { transition-duration: 0ms !important; }
  }

  #dbg {
    position: fixed; top: 0; left: 0; z-index: 99;
    font: 12px/1.45 Menlo, Consolas, monospace;
    color: #0f0; background: rgba(0,0,0,0.8);
    padding: 6px 9px; white-space: pre; display: none;
    pointer-events: none;
  }
  #dbg.on { display: block; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="status"></div>
<div id="dbg"></div>
<script>
(function () {
  'use strict';

  // The caption bar never paints an error. The one exception to "blank on
  // failure" is the small #status line, which exists precisely because a
  // deaf audience cannot tell a blank bar from a broken one.

  var P, cfg, elBar, elStatus, elDbg;
  var rows = [], rowEls = [], awaitNewLine = false;
  var queue = [], pendingInterim = null, drainTimer = null;
  var eventInfo = null, health = null, faultSince = 0, linkDownAt = 0, pausedSince = 0, statusText = '';
  var fittedChars = 0, resizeTimer = null;
  var barOn = false, lastTextAt = 0, lastMsgAt = 0, startedAt = 0;
  var sock = null, reconnTimer = null, attempts = 0, lastDelay = 0;
  var sessionId = null, lastSeq = -1, msgCount = 0, clipped = false;
  var mode = 'live';

  function now() { return Date.now(); }
  function log() {
    try { console.log.apply(console, ['[wall]'].concat([].slice.call(arguments))); } catch (e) {}
  }

  // ---- query params ------------------------------------------------------

  function num(key, dflt, lo, hi) {
    var v = parseFloat(P.get(key));
    if (!isFinite(v)) return dflt;
    if (v < lo) v = lo;
    if (v > hi) v = hi;
    return v;
  }
  function hex(key, dflt) {
    var v = (P.get(key) || '').replace(/^#/, '');
    return /^([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v) ? ('#' + v) : dflt;
  }
  function flag(key) {
    var v = P.get(key);
    return v !== null && v !== '' && v !== '0' && v !== 'false' && v !== 'no';
  }
  function rgba(hexColor, alpha) {
    var h = hexColor.replace('#', '');
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  function readConfig() {
    return {
      size:     num('size', 6.5, 1, 40),          // vh
      bottom:   num('bottom', 9, 0, 90),          // vh
      width:    num('width', 86, 10, 100),        // vw
      pad:      num('pad', 2, 0, 12),             // vh
      radius:   num('radius', 1.5, 0, 20),        // vh
      opacity:  num('opacity', 0.85, 0.6, 1),     // floor: white on 60% black over white video is still 5.7:1
      bar:      hex('bar', '#000000'),
      color:    hex('color', '#ffffff'),
      lines:    Math.round(num('lines', 3, 2, 4)), // 3 gives a slow reader ~8 s per line at speech rate
      idle:     num('idle', 15, 0, 3600),         // seconds, 0 = never fade
      nostatus: flag('nostatus'),                 // hide the reconnecting/paused line
      welcome:  flag('welcome'),                  // also show the welcome/ended message
      fade:     num('fade', 600, 0, 10000),       // ms
      maxchars: Math.round(num('maxchars', 36, 8, 200)),   // ceiling; the real limit is measured, see fitMaxChars
      align:    (P.get('align') === 'center' || P.get('align') === 'right') ? P.get('align') : 'left',
      font:     P.get('font') === 'atkinson' ? 'atkinson' : 'default',
      watchdog: num('watchdog', 120, 10, 86400),  // seconds dead before reload
      debug:    flag('debug'),
      text:     P.get('text'),
      soak:     P.get('soak'),
      lang:     P.get('lang') || '',              // caption stream, e.g. es; '' = the room's language
      relay:    location.protocol === 'file:' ? P.get('relay') : null   // file:// use only, see phone.html
    };
  }

  function applyStyle() {
    var r = document.documentElement.style;
    r.setProperty('--size', cfg.size + 'vh');
    r.setProperty('--bottom', cfg.bottom + 'vh');
    r.setProperty('--width', cfg.width + 'vw');
    r.setProperty('--pad', cfg.pad + 'vh');
    r.setProperty('--radius', cfg.radius + 'vh');
    r.setProperty('--fade', cfg.fade + 'ms');
    r.setProperty('--color', cfg.color);
    r.setProperty('--bar', rgba(cfg.bar, cfg.opacity));
    r.setProperty('--align', cfg.align);
    r.setProperty('--font-family', cfg.font === 'atkinson'
      ? '"Atkinson Hyperlegible", "Helvetica Neue", Helvetica, Arial, sans-serif'
      : '"Helvetica Neue", Helvetica, Arial, "Segoe UI", system-ui, sans-serif');
  }

  // Characters per line used to be a number the operator guessed; a line
  // that did not fit was clipped at its end, losing the last words. Now the
  // row is measured with the real font and the limit is whichever is smaller:
  // the operator's ceiling or what actually fits.
  var FIT_SAMPLE = 'The quick brown fox jumps over the lazy dog, 1234 times.';
  function fitMaxChars() {
    try {
      var row = rowEls[0];
      if (!row) return;
      var inner = row.clientWidth;
      var canvas = fitMaxChars._c || (fitMaxChars._c = document.createElement('canvas'));
      var ctx = canvas.getContext('2d');
      ctx.font = getComputedStyle(row).font;
      var avg = ctx.measureText(FIT_SAMPLE).width / FIT_SAMPLE.length;
      if (!(avg > 0) || !(inner > 0)) return;
      fittedChars = Math.max(8, Math.floor(inner / avg) - 1);
    } catch (e) { fittedChars = 0; }
  }
  function maxChars() {
    return fittedChars ? Math.min(cfg.maxchars, fittedChars) : cfg.maxchars;
  }

  // ---- text shaping ------------------------------------------------------

  // Split a committed line into pieces that each fit maxchars, on word
  // boundaries. Only finals go through this - it is the only line break.
  function chunk(text, max) {
    var out = [], cur = '';
    var words = String(text).replace(/\s+/g, ' ').replace(/^ | $/g, '').split(' ');
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (!w) continue;
      while (w.length > max) {                  // a token longer than a whole line
        if (cur) { out.push(cur); cur = ''; }
        out.push(w.slice(0, max));
        w = w.slice(max);
      }
      if (!cur) cur = w;
      else if (cur.length + 1 + w.length <= max) cur += ' ' + w;
      else { out.push(cur); cur = w; }
    }
    if (cur) out.push(cur);
    return out;
  }

  // An interim may not reflow or break, so when it outgrows the line we show
  // its tail - the words just spoken - cut at a word boundary.
  function tail(text, max) {
    var t = String(text).replace(/\s+/g, ' ').replace(/^ | $/g, '');
    if (t.length <= max) return t;
    t = t.slice(t.length - max);
    var sp = t.indexOf(' ');
    return sp >= 0 ? t.slice(sp + 1) : t;
  }

  // ---- render ------------------------------------------------------------

  function buildRows() {
    elBar.textContent = '';
    rowEls = []; rows = [];
    for (var i = 0; i < cfg.lines; i++) {
      var s = document.createElement('span');
      s.className = 'line';
      elBar.appendChild(s);
      rowEls.push(s); rows.push('');
    }
  }
  function last() { return rows.length - 1; }
  function shiftRows() { rows.shift(); rows.push(''); }

  function paint() {
    for (var i = 0; i < rowEls.length; i++) rowEls[i].textContent = rows[i];
    if (cfg.debug) {
      clipped = false;
      for (var j = 0; j < rowEls.length; j++) {
        if (rowEls[j].scrollWidth > rowEls[j].clientWidth) clipped = true;
      }
    }
  }
  function wake() {
    lastTextAt = now();
    if (!barOn) { barOn = true; elBar.className = 'on'; }
  }
  function hideBar() {
    if (barOn) { barOn = false; elBar.className = ''; }
  }
  function resetLines() {
    for (var i = 0; i < rows.length; i++) rows[i] = '';
    awaitNewLine = false;
    queue.length = 0; pendingInterim = null;
    clearTimeout(drainTimer); drainTimer = null;
    paint();
    hideBar();
  }

  // A committed line longer than one row used to be walked through in a
  // single pass and painted once, so only its last rows ever appeared - the
  // opening of every long sentence was lost. Now the rows go out one at a
  // time, each held long enough to read (700 ms floor, ~40 ms per
  // character, 2 s cap), and live interim text waits its turn behind them.
  function holdFor(text) { return Math.min(2000, Math.max(700, text.length * 40)); }

  function drain() {
    drainTimer = null;
    if (!queue.length) {
      if (pendingInterim !== null) {
        var t = pendingInterim; pendingInterim = null;
        onInterim(t);
      }
      return;
    }
    var part = queue.shift();
    shiftRows(); rows[last()] = part;
    paint(); wake();
    if (queue.length) drainTimer = setTimeout(drain, holdFor(part));
    else if (pendingInterim !== null) drainTimer = setTimeout(drain, Math.min(holdFor(part), 900));
  }

  function onInterim(text) {
    var t = tail(text, maxChars());
    if (!t) return;
    if (queue.length || drainTimer) { pendingInterim = text; return; }
    if (awaitNewLine) { shiftRows(); awaitNewLine = false; }
    rows[last()] = t;
    paint();
    wake();
  }

  function onFinal(text, replay) {
    var parts = chunk(text, maxChars());
    if (!parts.length) return;
    if (replay) {
      // History for a viewer that just (re)connected: fill the rows so the
      // next live line has context above it, but do not light the bar -
      // minutes-old text must not appear as though it was just said.
      for (var i = 0; i < parts.length; i++) {
        if (awaitNewLine || rows[last()]) shiftRows();
        rows[last()] = parts[i];
        awaitNewLine = true;
      }
      paint();
      return;
    }
    if (queue.length || drainTimer) {
      // Still rolling out the previous final: these rows follow, in order.
      Array.prototype.push.apply(queue, parts);
      pendingInterim = null;
      return;
    }
    if (awaitNewLine) shiftRows();
    rows[last()] = parts[0];        // the final commits the line already showing
    awaitNewLine = true;
    paint();
    wake();
    if (parts.length > 1) {
      Array.prototype.push.apply(queue, parts.slice(1));
      drainTimer = setTimeout(drain, holdFor(parts[0]));
    }
  }

  // ---- status line -------------------------------------------------------

  function setStatus(text) {
    if (text === statusText) return;
    statusText = text;
    elStatus.textContent = text || '';
    elStatus.className = text ? 'on' : '';
  }

  function computeStatus(n) {
    if (cfg.nostatus || mode !== 'live') return '';
    var linkDown = !sock || sock.readyState !== 1 || (n - lastMsgAt) > 20000;
    if (linkDown) {
      if (!linkDownAt) linkDownAt = n;
      if ((n - linkDownAt) > 2500) return 'Captions reconnecting…';
    } else {
      linkDownAt = 0;
    }
    var ev = eventInfo || {};
    if (ev.state === 'paused') {
      // Same short grace as the reconnect/fault banners below - a deliberate
      // operator pause still shouldn't slam into view mid-word.
      if (!pausedSince) pausedSince = n;
      return (n - pausedSince) > 2500 ? (ev.pause_message || 'Captions paused') : '';
    }
    pausedSince = 0;
    if (ev.state === 'starting') return cfg.welcome ? (ev.message || 'Captions will begin shortly') : '';
    if (ev.state === 'ended') return cfg.welcome ? 'Captions have ended' : '';
    if (health && health.fault) {
      if (!faultSince) faultSince = n;
      if ((n - faultSince) > 2500) return 'Captions paused — technical difficulty';
    } else {
      faultSince = 0;
    }
    return '';
  }

  function applyEvent(ev) {
    var prev = eventInfo ? eventInfo.state : null;
    eventInfo = ev;
    if (prev !== ev.state && (ev.state === 'starting' || ev.state === 'ended')) resetLines();
  }

  // ---- websocket ---------------------------------------------------------

  function wsUrl() {
    var host = cfg.relay || location.host;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    if (!host) { host = 'localhost:8000'; proto = 'ws:'; }   // opened as file://
    var url = proto + '//' + host + '/ws/viewer?role=wall';
    // A wall can show a translated stream: ?lang=es joins Spanish and replays
    // Spanish history on reconnect. No lang means the room's language.
    if (cfg.lang) url += '&lang=' + encodeURIComponent(cfg.lang);
    return url;
  }

  function connect() {
    var url = wsUrl();
    log('connect', url, 'attempt', attempts);
    try {
      sock = new WebSocket(url);
    } catch (e) {
      log('ctor failed', e);
      sock = null;
      scheduleReconnect();
      return;
    }
    sock.onopen = function () {
      attempts = 0;
      lastMsgAt = now();
      linkDownAt = 0;
      log('open');
    };
    sock.onmessage = onMessage;
    sock.onclose = teardown;
    sock.onerror = teardown;
  }

  function teardown() {
    if (sock) {
      // drop handlers so a late error/close cannot schedule a second reconnect
      sock.onopen = sock.onmessage = sock.onclose = sock.onerror = null;
      try { sock.close(); } catch (e) {}
      sock = null;
    }
    scheduleReconnect();
  }

  function scheduleReconnect() {
    if (reconnTimer) return;
    attempts++;
    var base = Math.min(10000, 500 * Math.pow(2, Math.min(attempts, 6)));
    lastDelay = Math.round(base * (0.75 + Math.random() * 0.5));   // jitter +/-25%
    log('reconnect in', lastDelay, 'ms');
    reconnTimer = setTimeout(function () {
      reconnTimer = null;
      connect();
    }, lastDelay);
  }

  function onMessage(ev) {
    lastMsgAt = now();
    msgCount++;
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (!m || typeof m.type !== 'string') return;

    if (m.type === 'hello') {
      if (sessionId && m.session_id !== sessionId) {
        log('new session', m.session_id, '- resetting');
        resetLines();
      }
      sessionId = m.session_id || null;
      lastSeq = -1;                        // the replay burst carries older seqs
      if (m.event) applyEvent(m.event);
      return;
    }
    if (typeof m.seq === 'number') {
      if (m.seq <= lastSeq) return;        // dupe or out of order
      lastSeq = m.seq;
    }
    switch (m.type) {
      case 'interim':   onInterim(m.text || ''); break;
      case 'final':     onFinal(m.text || '', !!m.replay); break;
      case 'clear':     resetLines(); break;
      case 'event':     applyEvent(m); break;
      case 'heartbeat':
        if (m.session_id && sessionId && m.session_id !== sessionId) {
          sessionId = m.session_id;
          resetLines();
        }
        if (m.event) applyEvent(m.event);
        if (m.health) health = m.health;
        break;
      default: break;                      // unknown types ignored, silently
    }
  }

  // ---- soak generator ----------------------------------------------------
  // Synthetic captions on a single chained timeout - never more than one timer
  // pending, no array that grows. Runs indefinitely.

  var SOAK_WORDS = ('the campus chapel service continues this morning with a reading ' +
    'from the second letter to the church at corinth followed by remarks from the ' +
    'dean of students about the upcoming semester schedule and a reminder that the ' +
    'library will keep extended hours through the end of examination week thank you').split(' ');

  function startSoak(rate) {
    var interimMs = Math.max(40, 200 / (rate || 1));
    var wordAt = 0, built = '', wordsThisLine = 0, target = 6, lineCount = 0;
    function step() {
      built = built ? built + ' ' + SOAK_WORDS[wordAt] : SOAK_WORDS[wordAt];
      wordAt = (wordAt + 1) % SOAK_WORDS.length;
      wordsThisLine++;
      if (wordsThisLine >= target) {
        onFinal(built.charAt(0).toUpperCase() + built.slice(1) + '.');
        built = ''; wordsThisLine = 0;
        target = 5 + Math.floor(Math.random() * 8);
        lineCount++;
        if (lineCount % 40 === 0) resetLines();     // exercise the clear path too
        setTimeout(step, interimMs * 6);
      } else {
        onInterim(built);
        setTimeout(step, interimMs);
      }
    }
    log('soak mode, rate', rate || 1);
    step();
  }

  // ---- the single timer --------------------------------------------------

  function tick() {
    var n = now();
    if (cfg.idle > 0 && barOn && (n - lastTextAt) > cfg.idle * 1000) hideBar();
    if (mode === 'live' && sock && sock.readyState === 1 && (n - lastMsgAt) > 20000) {
      // Heartbeats are every 5 s; 20 s of silence is a dead link the socket
      // has not noticed. Reconnect now rather than sit blank for two minutes.
      log('stale link, forcing reconnect');
      teardown();
    }
    if (mode === 'live' && (n - lastMsgAt) > cfg.watchdog * 1000) {
      log('watchdog: no traffic for', cfg.watchdog, 's - reloading');
      try { location.reload(); } catch (e) {}
      return;
    }
    setStatus(computeStatus(n));
    if (cfg.debug) paintDebug(n);
  }

  var WS_NAMES = ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'];
  function paintDebug(n) {
    var st = sock ? (WS_NAMES[sock.readyState] || sock.readyState) : 'none';
    elDbg.textContent =
      'mode      ' + mode + '\n' +
      'ws        ' + st + '  ' + (mode === 'live' ? wsUrl() : '-') + '\n' +
      'session   ' + (sessionId || '-') + '\n' +
      'seq       ' + lastSeq + '   msgs ' + msgCount + '\n' +
      'last msg  ' + ((n - lastMsgAt) / 1000).toFixed(1) + 's ago\n' +
      'attempts  ' + attempts + '   next backoff ' + lastDelay + 'ms\n' +
      'bar       ' + (barOn ? 'visible' : 'faded') +
        '   idle ' + ((n - lastTextAt) / 1000).toFixed(1) + 's\n' +
      'maxchars  ' + maxChars() + ' (ceiling ' + cfg.maxchars + ', fits ' + (fittedChars || '?') + ')' +
        (clipped ? '   *** TEXT CLIPPED ***' : '') + '\n' +
      'rows      ' + cfg.lines + '   queued ' + queue.length +
        '   event ' + (eventInfo ? eventInfo.state : '-') +
        '   fault ' + (health && health.fault ? health.fault : '-') + '\n' +
      'size      ' + cfg.size + 'vh   width ' + cfg.width + 'vw\n' +
      'uptime    ' + ((n - startedAt) / 1000).toFixed(0) + 's';
  }

  // ---- boot --------------------------------------------------------------

  function boot() {
    P = new URLSearchParams(location.search);
    cfg = readConfig();
    elBar = document.getElementById('bar');
    elStatus = document.getElementById('status');
    elDbg = document.getElementById('dbg');
    applyStyle();
    buildRows();
    fitMaxChars();
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fitMaxChars, 150);
    });
    if (cfg.debug) { elDbg.className = 'on'; document.body.style.cursor = 'default'; }
    startedAt = lastMsgAt = lastTextAt = now();

    if (cfg.text !== null) {
      mode = 'text';          // framing mode: static text, no socket, no fade
      cfg.idle = 0;
      onFinal(cfg.text);
      wake();
    } else if (cfg.soak !== null) {
      mode = 'soak';
      startSoak(parseFloat(cfg.soak) || 1);
    } else {
      connect();
    }
    setInterval(tick, 250);   // the only interval on the page
    log('booted', cfg);
  }

  try {
    boot();
  } catch (e) {
    // Last resort: leave the page blank and transparent. Never paint an error.
    try { console.error('[wall] boot failed', e); } catch (e2) {}
  }
})();
</script>
</body>
</html>
