# Copy to config/event.toml and edit. config/event.toml is gitignored, so the
# real one never lands in the repo.

[relay]
host = "0.0.0.0"          # all interfaces, so phones on the LAN can connect
port = 8000
# Shared secret the capture client must send on /ws/source. Leave it empty:
# the relay generates one on first start and saves it to .env as
# CAPTIONS_SOURCE_TOKEN, where the capture client reads it too. A token is
# always required - the audience is on the booth network as well, so "no
# token" was never safe. This is not a Deepgram key; that lives in the
# environment only, never in this file.
source_token = ""
# Set this to the domain a tunnel (e.g. Cloudflare Tunnel) exposes this relay
# on. Anyone reaching the relay through this exact hostname gets read-only
# access - the phone/wall/qr views and nothing else. /status, /tune,
# /api/control, /api/youtube-captions, /api/transcript.srt, /ws/status and
# /ws/source all 404 for them, and the bare domain lands on the phone view
# instead of the operator dashboard. Requests on localhost or the LAN IP are
# never affected by this, regardless of what it's set to. Empty (the default)
# means no tunnel and no gating.
public_hostname = ""

[languages]
source = "en"
# Offered in the phone view's picker. The relay advertises only languages it
# can actually deliver, so a language listed here without a working
# translator does not put a dead option in front of the audience.
#
# This list is also the cost lever: each language here is translated for
# every committed line while the stream is open. Removing one stops paying
# for it.
#   "es" Spanish   "pt" Portuguese   "zh-Hans" Simplified Chinese
#   "zh-Hant" Traditional Chinese    "ko" Korean   "vi" Vietnamese
offer = []

# What attendees see on their phones before and after the captions: the
# welcome screen. Everything here is editable live from the status page's
# "Event & welcome screen" panel, which also writes it back into this file,
# and `state` is saved on every Start/Pause/End so a relay restart mid-event
# does not put the welcome screen back up. A background photo goes in
# config/welcome.jpg|png|webp via the same panel (gitignored).
[event]
state = "starting"        # starting | live | paused | ended
title = ""                # e.g. "Fall Convocation"
message = ""              # default: "Live captions will begin when the program starts."
notice = ""               # e.g. "Captions are automatic. Accommodations: Disability Services, 334-555-0100"
pause_message = ""        # shown over the captions while paused; default "Captions paused"
logo_alt = ""             # screen-reader name for the logo (config/logo.*), e.g. "Faulkner University"
# Shown once per device on the phone view, with a dismiss button - not tied
# to event state like `notice` above, so it is just as relevant mid-event.
# Blank disables it. Reappears if you change the wording, but not just
# because the field was saved again with the same text.
disclaimer = ""           # e.g. "Captions are auto-generated and may not be 100% accurate."

[translate]
# "azure" or "none". The key is read from AZURE_TRANSLATOR_KEY in .env - never
# from this file. AZURE_TRANSLATOR_REGION is required for a regional resource.
#
# Only committed lines are translated, never in-progress ones: interims
# change several times a second, so translating them would multiply the bill
# by roughly twenty and produce text that rewrites itself faster than anyone
# can read.
provider = "none"

# Direct caption output into ProPresenter over its network API (Settings ->
# Network -> Enable Network; note the port). Read by the relay - see
# relay/propresenter.py and SETUP.md 7a. Everything here can also be set from
# the Settings page's "ProPresenter (direct)" panel, which writes it back here.
[propresenter]
host = "127.0.0.1"          # the machine running ProPresenter; this one, usually
port = 1025                 # whatever ProPresenter's Network settings show
surface = "stage_message"   # stage_message | message  (see SETUP.md 7a)
message = "Live Captions"   # for surface = "message": the Message's name...
token = "Caption"           #   ...and the name of its one text token
language = ""               # which caption stream to send; "" = the room's language
reveal = "line"             # line = finished sentences only | word = stream as spoken
lines = 2                   # never more than two; longer speech is paged
chars_per_line = 42         # what one line of your ProPresenter text box holds
start_enabled = false       # true = start sending as soon as the relay starts

# Wall output keys (OBS, vMix, ProPresenter Web Fill). Managed from the
# Settings page. While any key exists, a wall without a valid ?key= is
# refused, so revoking a key switches that output off. Empty = no key needed.
[overlay]
keys = []                   # e.g. ["obs:abc123", "propresenter:def456"]

# --- stage 3, not read by the relay ---------------------------------------

[capture]
# "auto" picks a backend this machine can actually run - apple_speech on a
# Mac new enough for it, practice mode (mock) everywhere else - so this one
# shipped file is right on Windows and macOS both. The setup wizard (opened
# on first run, or /setup any time after) is where a real choice gets made
# and written back here; the status page's picker changes it live.
backend = "auto"      # auto | mock | deepgram | apple_speech | whisper
device = ""                                        # index or name substring
relay_url = "ws://127.0.0.1:8000/ws/source"
mock_script = "config/mock_script.txt"

# Applies after transcription, the same way on every backend - unlike
# [deepgram]'s own keyterms_file/profanity_filter below, which are that
# backend's own API-level features. Both boosted and blocked terms are
# plain text files, one term or short phrase per line; editable live from
# the status page's "Keywords & profanity filter" panel, which also
# reloads them.
[keywords]
blocklist_file = "config/blocklist.txt"
profanity_filter = true         # bleep the built-in list; [deepgram]'s own is separate

[deepgram]
model = "nova-3"
language = "en-US"
keyterms_file = "config/keyterms.txt"
# Speaker changes become ">>" at the start of the new speaker's words on
# committed lines - the broadcast-caption convention. Names still have to
# come from the operator (the status page's caption box). false to disable.
diarize = true
# A committed word the model itself doubts (confidence below this) is shown
# as [inaudible] instead of a confident wrong guess. 0 disables.
inaudible_below = 0.3
# Verbatim is the accessible default: deaf attendees should receive what
# hearing attendees hear. Turning the filter on changes that, so it is an
# explicit choice here, never a surprise. This is Deepgram's own native
# filter (deepgram-only); [keywords] above has a backend-agnostic one.
profanity_filter = false
filler_words = false

# On-device, free, no key - but macOS 26+ only, and no keyterm boosting.
# Running from source: first open() compiles capture/backends/native/speech_helper.swift
# (needs the Xcode command line tools). In the packaged .app it ships prebuilt,
# so no Xcode is needed there. Either way, the very first time a given locale
# is used, macOS downloads that locale's on-device model (needs internet once).
[apple_speech]
locale = "en-US"

# On-device Whisper. No network, no API key, no spend - good for demos, for a
# venue with no internet, and for platforms other than macOS. Needs the
# optional extras:
#     python -m pip install -r requirements-whisper.txt
# The model downloads on first use and is then cached.
[whisper]
model = "base.en"        # tiny.en | base.en | small.en | medium.en, or a
                         # multilingual name like "small" for non-English audio
compute_type = "int8"    # int8 is fastest on CPU; float16 needs a GPU
device = "cpu"           # leave as cpu unless you have verified a GPU works
interim_interval = 0.9   # seconds between interim re-decodes (each decodes the last 8 s only)
silence_commit = 0.7     # seconds of quiet that commits a line; utterances are forced at 12 s
# model_dir = "models"   # pre-downloaded models, for a machine with no internet

# Pushes finalized captions to a YouTube Live stream's caption ingestion URL
# (YouTube Studio -> Closed captions -> "POST captions to URL"). Read by the
# relay, not the capture client - see README.md "Pushing captions to YouTube".
# `url` doesn't need to be set here by hand: pasting it into the YouTube Live
# captions box on the status page writes it into this file automatically.
# A translated language can go to its own YouTube broadcast track too - see
# YOUTUBE_CAPTION_URL_<LANG> in .env.example - but that one is env-only, with
# no status-page field, since it's a secondary/advanced option.
[youtube]
url = ""
lang = "en-US"
start_enabled = false      # true = start pushing as soon as the relay starts

# AFTER the event: the relay records every committed line with timings. Press
# "Mark video start" on the status page when the stream begins, download the
# .srt from the Transcript & translation panel afterwards, and optionally
# upload it to a video's caption track with tools/youtube_upload.py.

# Optional read-only static cue thumbnails for phones. Restart after editing.
# See docs/PHONE-SLIDES.md before enabling; audience Look overrides are unsupported.
[slides]
enabled = false
host = "127.0.0.1"
port = 1025
screen = 0                  # zero-based audience screen in the current Look
approved_hosts = []          # explicit RFC1918 IPs only when using another local Mac

# How Campus Captions opens its own pages. "app" is a chromeless browser
# window - no address bar, no tabs, its own taskbar or Dock entry - which is
# what makes a web app feel like a program. "browser" is an ordinary tab.
# Needs Chrome, Edge, Brave or Chromium; a machine with only Firefox or
# Safari falls back to a tab whatever this says. Changed from the Settings
# page under System.
[ui]
window_mode = "app"        # app | browser
