# Copy to config/event.toml and edit. config/event.toml is gitignored, so the
# real one never lands in the repo.

[relay]
host = "0.0.0.0"          # all interfaces, so phones on the LAN can connect
port = 8000
# Shared secret the capture client must send on /ws/source. Empty = no token,
# which is fine on a closed booth network. This is not a Deepgram key; that
# lives in the environment only, never in this file.
source_token = ""
# Set this to the domain a tunnel (e.g. Cloudflare Tunnel) exposes this relay
# on. Anyone reaching the relay through this exact hostname gets read-only
# access - the phone/wall/qr views and nothing else. /status, /tune,
# /api/control, /api/youtube-captions, /api/transcript.srt, /ws/status and
# /ws/source all 404 for them, and the bare domain lands on the phone view
# instead of the operator dashboard. Requests on localhost or the LAN IP are
# never affected by this, regardless of what it's set to. Empty (the default)
# means no tunnel and no gating.
public_hostname = ""

[languages]
source = "en"
# Offered in the phone view's picker. The relay advertises only languages it
# can actually deliver, so a language listed here without a working
# translator does not put a dead option in front of the audience.
#
# This list is also the cost lever: each language here is translated for
# every committed line while the stream is open. Removing one stops paying
# for it.
#   "es" Spanish   "pt" Portuguese   "zh-Hans" Simplified Chinese
#   "zh-Hant" Traditional Chinese    "ko" Korean   "vi" Vietnamese
offer = []

[translate]
# "azure" or "none". The key is read from AZURE_TRANSLATOR_KEY in .env - never
# from this file. AZURE_TRANSLATOR_REGION is required for a regional resource.
#
# Only committed lines are translated, never in-progress ones: interims
# change several times a second, so translating them would multiply the bill
# by roughly twenty and produce text that rewrites itself faster than anyone
# can read.
provider = "none"

# --- stage 3, not read by the relay ---------------------------------------

[capture]
backend = "apple_speech"        # mock | deepgram | apple_speech | whisper
device = ""                                        # index or name substring
relay_url = "ws://127.0.0.1:8000/ws/source"
mock_script = "config/mock_script.txt"

[deepgram]
model = "nova-3"
language = "en-US"
keyterms_file = "config/keyterms.txt"

# On-device, free, no key - but macOS 26+ only, and no keyterm boosting.
# Running from source: first open() compiles capture/backends/native/speech_helper.swift
# (needs the Xcode command line tools). In the packaged .app it ships prebuilt,
# so no Xcode is needed there. Either way, the very first time a given locale
# is used, macOS downloads that locale's on-device model (needs internet once).
[apple_speech]
locale = "en-US"

# On-device Whisper. No network, no API key, no spend - good for demos, for a
# venue with no internet, and for platforms other than macOS. Needs the
# optional extras:
#     python -m pip install -r requirements-whisper.txt
# The model downloads on first use and is then cached.
[whisper]
model = "base.en"        # tiny.en | base.en | small.en | medium.en, or a
                         # multilingual name like "small" for non-English audio
compute_type = "int8"    # int8 is fastest on CPU; float16 needs a GPU
device = "cpu"           # leave as cpu unless you have verified a GPU works
interim_interval = 0.9   # seconds between interim re-decodes
silence_commit = 0.7     # seconds of quiet that commits a line
# model_dir = "models"   # pre-downloaded models, for a machine with no internet

# Pushes finalized captions to a YouTube Live stream's caption ingestion URL
# (YouTube Studio -> Closed captions -> "POST captions to URL"). Read by the
# relay, not the capture client - see README.md "Pushing captions to YouTube".
# `url` doesn't need to be set here by hand: pasting it into the YouTube Live
# captions box on the status page writes it into this file automatically.
# A translated language can go to its own YouTube broadcast track too - see
# YOUTUBE_CAPTION_URL_<LANG> in .env.example - but that one is env-only, with
# no status-page field, since it's a secondary/advanced option.
[youtube]
url = ""
lang = "en-US"
start_enabled = false      # true = start pushing as soon as the relay starts

# AFTER the event: the relay records every committed line with timings. Press
# "Mark video start" on the status page when the stream begins, download the
# .srt from the Transcript & translation panel afterwards, and optionally
# upload it to a video's caption track with tools/youtube_upload.py.
