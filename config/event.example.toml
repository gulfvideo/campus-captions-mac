# Copy to config/event.toml and edit. config/event.toml is gitignored, so the
# real one never lands in the repo.

[relay]
host = "0.0.0.0"          # all interfaces, so phones on the LAN can connect
port = 8000
# Shared secret the capture client must send on /ws/source. Empty = no token,
# which is fine on a closed booth network. This is not a Deepgram key; that
# lives in the environment only, never in this file.
source_token = ""

# How the site is reached. Host-agnostic: the same relay works behind a
# Cloudflare Tunnel, an internal DNS name, or a VM, depending only on what you
# put in public_url.
[site]
# The address phones should use. Empty = advertise this machine's LAN IP.
# e.g. "https://captions.school.edu"
public_url = ""

# "lan"    - trusted booth network. No passwords; the operator just clicks.
# "public" - reachable from the internet. /status, /tune, /api/status and
#            /api/control then require the admin token below, because otherwise
#            a stranger could open the ASR stream and spend your money.
mode = "lan"

# Only used when mode = "public". Leave empty and one is generated per run and
# printed at startup; set it here to keep it stable across restarts.
admin_token = ""

[languages]
source = "en"
# Offered in the phone view's picker. The relay advertises only languages it can
# actually deliver, so a language listed here without a working translator does
# not put a dead option in front of the audience.
#
# This list is also the cost lever: each language here is translated for every
# committed line while the stream is open. Removing one stops paying for it.
#   "es" Spanish   "pt" Portuguese   "zh-Hans" Simplified Chinese
#   "zh-Hant" Traditional Chinese    "ko" Korean   "vi" Vietnamese
offer = []

[translate]
# "azure" or "none". The key is read from AZURE_TRANSLATOR_KEY in .env - never
# from this file. AZURE_TRANSLATOR_REGION is required for a regional resource.
#
# Only committed lines are translated, never in-progress ones: interims change
# several times a second, so translating them would multiply the bill by roughly
# twenty and produce text that rewrites itself faster than anyone can read.
provider = "none"

# YouTube. Both paths are optional and independent.
#
# LIVE captions during a broadcast: set the broadcast's caption source to
# "POST captions to URL" in YouTube Studio, then put the ingestion URL in .env
# as YOUTUBE_CAPTION_URL. It is a secret - anyone holding it can write captions
# onto your stream - so it never goes in this file. A translated track can go to
# its own broadcast with YOUTUBE_CAPTION_URL_ES, YOUTUBE_CAPTION_URL_ZH_HANS...
#
# AFTER the event: the relay records every committed line with timings. Press
# "Mark video start" on the status page when the stream begins, download the
# .srt afterwards, and upload it with tools/youtube_upload.py.

# --- stage 3, not read by the relay ---------------------------------------

[capture]
backend = "mock"                                   # mock | deepgram | local
device = ""                                        # index or name substring
relay_url = "ws://127.0.0.1:8000/ws/source"
mock_script = "config/mock_script.txt"

[deepgram]
model = "nova-3"
language = "en-US"
keyterms_file = "config/keyterms.txt"

# On-device Whisper. No network, no API key, no spend - good for demos and for
# a venue with no internet. Needs the optional extras:
#     python -m pip install -r requirements-local.txt
# The model downloads on first use and is then cached.
[local]
model = "base.en"        # tiny.en | base.en | small.en | medium.en, or a
                         # multilingual name like "small" for non-English audio
compute_type = "int8"    # int8 is fastest on CPU; float16 needs a GPU
device = "cpu"           # leave as cpu unless you have verified a GPU works
interim_interval = 0.9   # seconds between interim re-decodes
silence_commit = 0.7     # seconds of quiet that commits a line
# model_dir = "models"   # pre-downloaded models, for a machine with no internet
