# Builds the downloadable Windows installer and attaches it to the GitHub
# release for the tag that triggered it.
#
# This exists because the project has no Windows build machine it can rely
# on. A release is cut by pushing a tag; ten minutes later there is a
# CampusCaptions-Setup-<version>.exe on the Releases page that a volunteer can
# download and double-click. Nobody has to have Python, Inno Setup, or a
# checkout.
#
# Run it by hand from the Actions tab (workflow_dispatch) to test a build
# without cutting a release - that path uploads the installer as a workflow
# artifact and creates no release.

name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the installer to the release

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version requirements.txt is pinned against - every wheel in
          # it has a cp314 build, so nothing compiles here.
          python-version: "3.14"
          cache: pip

      - name: Create the virtual environment build.ps1 expects
        run: |
          py -3 -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt `
            -r winapp\requirements-build.txt -r requirements-whisper.txt

      - name: Byte-compile every module
        # Same guard as ci.yml: catch a syntax error or a file that was
        # edited but never committed before spending ten minutes freezing it.
        run: .venv\Scripts\python.exe -m compileall -q relay capture launcher winapp tools

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the app and the installer
        run: powershell -ExecutionPolicy Bypass -File winapp\build.ps1

      - name: Read the version
        id: version
        run: |
          $v = .venv\Scripts\python.exe -c "from launcher.version import VERSION; print(VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check the build is not obviously broken
        # PyInstaller happily produces an .exe that dies on its first import,
        # and a broken build must not reach a release page. A runner has no
        # display and no audio device, so the tray cannot actually be run
        # here; importing every module the frozen app imports is what catches
        # the failure this build is prone to - a hidden import PyInstaller did
        # not find. The .exe's own existence is checked separately.
        run: |
          $exe = "winapp\dist\Campus Captions\Campus Captions.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }
          .venv\Scripts\python.exe tools/windows_build_check.py

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCaptions-Setup-${{ steps.version.outputs.version }}
          path: winapp/dist/CampusCaptions-Setup-*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: winapp/dist/CampusCaptions-Setup-*.exe
          draft: false
          body: |
            ## Windows

            Download **CampusCaptions-Setup-${{ steps.version.outputs.version }}.exe**
            below and double-click it. No Python, no zip, no terminal.

            Windows will show a blue "Windows protected your PC" box the first
            time — click **More info**, then **Run anyway**. That appears
            because the installer is not code-signed, and it is once per
            computer, not once per launch.

            The app puts a graduation-cap icon in the notification area
            (bottom-right, sometimes behind the ^ arrow) and opens a setup
            wizard in your browser the first time it runs.
          fail_on_unmatched_files: true
