# Runs on every push and every pull request, so each commit carries a green
# tick or a red cross of its own. That is the point: a commit nobody has
# tested is a commit nobody can safely merge, revert to, or ship from.
#
# It exercises the relay only. The relay imports no audio libraries - no
# sounddevice, no numpy - so this needs no PortAudio, no microphone and no
# macOS runner. The capture client and the packaged .app still need a Mac and
# a person; see docs/GIT-ETIQUETTE.md for what CI does and does not cover.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the older run still in flight -
# no point paying for a test of code already replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: End-to-end relay smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        # Catches a syntax error, and a file that was edited but never
        # `git add`ed, before the slower test below runs.
        run: python -m compileall -q relay capture launcher macapp tools

      - name: Smoke test
        run: python tools/smoke_test.py "$GITHUB_WORKSPACE"
