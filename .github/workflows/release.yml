# Builds the downloadable apps and attaches them to the GitHub release for
# the tag that triggered it.
#
# This exists because the project has no build machine it can rely on. A
# release is cut by pushing a v* tag; some minutes later the Releases page
# carries a macOS disk image that a volunteer can download and double-click,
# with no Python, no Xcode and no checkout anywhere in the story.
#
# Run it by hand from the Actions tab (workflow_dispatch) to test a build
# without cutting a release - that path uploads each app as a workflow
# artifact and creates no release.

name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos_allow_missing_helper:
        description: >-
          Build the macOS app even if the Swift speech helper will not
          compile (apple_speech will not work in that build)
        type: boolean
        default: false

permissions:
  contents: write        # needed to attach the apps to the release

jobs:
  # ------------------------------------------------------------------ macOS
  # Apple Silicon only. apple_speech needs macOS 26, and the Intel Macs that
  # can run 26 are the last of their line; an x86_64 build also could not
  # carry Whisper (onnxruntime ships no macOS x86_64 wheel for Python 3.14).
  macos:
    name: macOS app (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      # Developer ID signing and notarization, when the secrets exist (see
      # README "Signing"). Without them the build is ad-hoc signed, as a
      # fork's would be.
      HAS_SIGNING: ${{ secrets.DEVID_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Report what this runner has
        # capture/backends/native/speech_helper.swift is built against
        # SpeechAnalyzer, which is macOS 26 and Xcode 26. If the helper step
        # below fails, this is the step that says why in one glance rather
        # than leaving a swiftc error to be interpreted. The architecture is
        # printed for the same reason: it is what decides which Macs the
        # resulting app can launch on at all.
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          xcodebuild -version || true
          echo "--- Xcodes installed ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none beyond the selected one)"
          echo "--- macOS SDKs ---"
          xcodebuild -showsdks 2>/dev/null | grep -i macosx || true

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install -r requirements.txt \
            -r macapp/requirements-build.txt -r requirements-whisper.txt

      - name: Byte-compile every module
        run: .venv/bin/python3 -m compileall -q relay capture launcher macapp tools

      - name: Select the newest Xcode
        # The image usually carries several and defaults to one of the older
        # ones. speech_helper.swift needs the macOS 26 SDK, so take the
        # highest version present rather than whatever xcode-select points at.
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            echo "selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          else
            echo "only one Xcode on this runner; leaving the selection alone"
          fi
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | grep -i macosx || true

      - name: Build the on-device speech helper
        # Built here rather than inside macapp/build.sh (which is told to
        # skip it below) so a too-old SDK is reported as this step, with the
        # explanation, instead of as a shell script that stopped.
        id: helper
        continue-on-error: true
        run: capture/backends/native/build.sh

      - name: Stop if the helper did not build
        # A build without the helper is a real degradation - apple_speech is
        # the free, private, no-account backend, and it is what a Mac on 26
        # would otherwise use - so this fails the job by default rather than
        # quietly publishing a crippled app.
        if: >-
          steps.helper.outcome == 'failure'
          && inputs.macos_allow_missing_helper != true
        run: |
          echo "::error::The Swift speech helper did not build on this runner."
          echo "speech_helper.swift needs the macOS 26 SDK (Xcode 26) for"
          echo "SpeechAnalyzer. See the 'Report what this runner has' step"
          echo "above for what is actually installed."
          echo
          echo "Options:"
          echo "  * build the .app on a Mac with Xcode 26 (macapp/build.sh)"
          echo "    and upload CampusCaptions.zip to the release by hand"
          echo "  * re-run this workflow from the Actions tab with"
          echo "    'Build the macOS app even if the Swift speech helper"
          echo "    will not compile' ticked, accepting that apple_speech"
          echo "    will not work in that build"
          exit 1

      - name: Load the Developer ID certificate and notarization login
        # Into a keychain made for this run, so nothing touches the runner's
        # login keychain. build.sh finds the certificate there on its own;
        # make_dmg.sh is pointed at it with NOTARY_KEYCHAIN.
        if: env.HAS_SIGNING == 'true'
        env:
          DEVID_P12_BASE64: ${{ secrets.DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$DEVID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          # The intermediate that chains the certificate to Apple's root; a
          # runner image is not guaranteed to carry it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
          xcrun notarytool store-credentials campus-captions --keychain "$kc" \
            --apple-id "$APPLE_ID" --team-id 7V4HF8KNDA --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Say the build will not be signed
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::No DEVID_P12_BASE64 secret - this build is ad-hoc signed and not notarized."

      - name: Build the app
        run: macapp/build.sh --skip-helper

      - name: Check the build is not obviously broken
        run: |
          app="macapp/dist/Campus Captions.app"
          test -d "$app" || { echo "PyInstaller produced no $app"; exit 1; }
          test -x "$app/Contents/MacOS/Campus Captions" || {
            echo "no executable inside $app"; exit 1; }
          codesign --verify --strict "$app" || {
            echo "the bundle is not validly signed"; exit 1; }
          .venv/bin/python3 tools/macos_build_check.py

      - name: Build the disk image
        # A .dmg rather than the .zip this project used to ship: opening it
        # and dragging one icon onto Applications is the gesture Mac users
        # already know, and it lands the app somewhere permanent. A zip
        # leaves the app loose in Downloads and makes "extract this first" a
        # step.
        run: |
          version=$(.venv/bin/python3 -c "from launcher.version import VERSION; print(VERSION)")
          macapp/make_dmg.sh "macapp/dist/CampusCaptions-$version-AppleSilicon.dmg"
          ls -lh macapp/dist/*.dmg

      - name: Build latest.json from the real file
        # An installed copy fetches this from the latest release to learn
        # whether a newer build exists; see relay/updater.py. The size and
        # SHA-256 are read off the bytes that were actually built - a
        # hand-written manifest is how you ship the previous release's
        # checksum and give every tester a failed verification.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # actions/checkout fetches the tagged commit by SHA and writes the
          # tag as a lightweight one, which loses the message. Fetch the real
          # tag object so the release notes are the tag's, not the commit's.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          .venv/bin/python3 tools/publish_update.py \
            --assets macapp/dist \
            --version "${GITHUB_REF_NAME#v}" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -c 3000)" \
            --out macapp/dist/latest.json
          cat macapp/dist/latest.json

      - name: Check the disk image mounts and holds the app
        # hdiutil can produce an image that is valid but empty, and a release
        # asset nobody opened before publishing is how that gets discovered
        # by the person it was made for.
        run: |
          mnt=$(mktemp -d)
          hdiutil attach macapp/dist/*.dmg -nobrowse -readonly -mountpoint "$mnt"
          ls -l "$mnt"
          test -d "$mnt/Campus Captions.app" || { echo "no app in the image"; exit 1; }
          test -L "$mnt/Applications" || { echo "no Applications shortcut"; exit 1; }
          codesign --verify --strict "$mnt/Campus Captions.app" || {
            echo "the signature did not survive the copy into the image"; exit 1; }
          if [ "$HAS_SIGNING" = true ]; then
            spctl --assess --type execute --verbose "$mnt/Campus Captions.app" || {
              echo "Gatekeeper does not accept the app as notarized"; exit 1; }
          fi
          hdiutil detach "$mnt" -quiet
          echo "disk image is good"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build the Companion module package
        # A fixed asset name, so the site can link releases/latest/download/
        # straight to it. Companion reads the version from inside the package.
        run: |
          cd integrations/companion-module-campus-captions
          npm ci
          npx companion-module-build
          cp campus-captions-*.tgz ../../macapp/dist/campus-captions-companion.tgz

      - name: Upload the app as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCaptions-macOS-AppleSilicon
          path: |
            macapp/dist/*.dmg
            macapp/dist/campus-captions-companion.tgz
          if-no-files-found: error

      - name: Attach the app and the manifest to the release
        # Not a prerelease: the app fetches latest.json through
        # releases/latest/, and GitHub points that at the newest release that
        # is not marked prerelease. Every version is tagged -beta regardless.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macapp/dist/*.dmg
            macapp/dist/latest.json
            macapp/dist/campus-captions-companion.tgz
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

