# Builds the downloadable apps and attaches them to the GitHub release for
# the tag that triggered it.
#
# This exists because the project has no build machine it can rely on for
# either platform. A release is cut by pushing a v* tag; some minutes later
# the Releases page carries a Windows installer and a macOS zip that a
# volunteer can download and double-click, with no Python, no Xcode and no
# checkout anywhere in the story.
#
# The two jobs are independent on purpose: no `needs:` between them, so a
# macOS runner without the SDK the Swift speech helper wants cannot stop the
# Windows installer from reaching the release, and vice versa.
#
# Run it by hand from the Actions tab (workflow_dispatch) to test a build
# without cutting a release - that path uploads each app as a workflow
# artifact and creates no release.

name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos_allow_missing_helper:
        description: >-
          Build the macOS app even if the Swift speech helper will not
          compile (apple_speech will not work in that build)
        type: boolean
        default: false

permissions:
  contents: write        # needed to attach the apps to the release

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version requirements.txt is pinned against - every wheel in
          # it has a cp314 build, so nothing compiles here.
          python-version: "3.14"
          cache: pip

      - name: Create the virtual environment build.ps1 expects
        run: |
          py -3 -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt `
            -r winapp\requirements-build.txt -r requirements-whisper.txt

      - name: Byte-compile every module
        # Same guard as ci.yml: catch a syntax error or a file that was
        # edited but never committed before spending ten minutes freezing it.
        run: .venv\Scripts\python.exe -m compileall -q relay capture launcher winapp tools

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the app and the installer
        run: powershell -ExecutionPolicy Bypass -File winapp\build.ps1

      - name: Check the build is not obviously broken
        # PyInstaller happily produces an .exe that dies on its first import,
        # and a broken build must not reach a release page. A runner has no
        # display and no audio device, so the tray cannot actually be run
        # here; importing every module the frozen app imports is what catches
        # the failure this build is prone to - a hidden import PyInstaller did
        # not find. The .exe's own existence is checked separately.
        run: |
          $exe = "winapp\dist\Campus Captions\Campus Captions.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no $exe" }
          .venv\Scripts\python.exe tools/windows_build_check.py

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCaptions-Setup
          path: winapp/dist/CampusCaptions-Setup-*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: winapp/dist/CampusCaptions-Setup-*.exe
          draft: false
          # Every release of this project carries hand-written notes, and
          # both jobs here attach to the same release. So neither sets a
          # `body`: the action leaves an existing release's notes alone,
          # which means re-running a failed build cannot wipe them and the
          # two jobs cannot overwrite each other. A tag pushed with no
          # release yet gets an empty one to fill in.
          prerelease: true      # matches the v*-beta convention on Releases
          fail_on_unmatched_files: true

  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Report what this runner has
        # capture/backends/native/speech_helper.swift is built against
        # SpeechAnalyzer, which is macOS 26 and Xcode 26. If the helper step
        # below fails, this is the step that says why in one glance rather
        # than leaving a swiftc error to be interpreted.
        run: |
          sw_vers
          xcodebuild -version || true
          echo "--- macOS SDKs ---"
          xcodebuild -showsdks 2>/dev/null | grep -i macosx || true

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install -r requirements.txt \
            -r macapp/requirements-build.txt -r requirements-whisper.txt

      - name: Byte-compile every module
        run: .venv/bin/python3 -m compileall -q relay capture launcher macapp tools

      - name: Build the on-device speech helper
        # Built here rather than inside macapp/build.sh (which is told to
        # skip it below) so a too-old SDK is reported as this step, with the
        # explanation, instead of as a shell script that stopped.
        id: helper
        continue-on-error: true
        run: capture/backends/native/build.sh

      - name: Stop if the helper did not build
        # A build without the helper is a real degradation - apple_speech is
        # the free, private, no-account backend, and it is what a Mac on 26
        # would otherwise use - so this fails the job by default rather than
        # quietly publishing a crippled app.
        if: >-
          steps.helper.outcome == 'failure'
          && inputs.macos_allow_missing_helper != true
        run: |
          echo "::error::The Swift speech helper did not build on this runner."
          echo "speech_helper.swift needs the macOS 26 SDK (Xcode 26) for"
          echo "SpeechAnalyzer. See the 'Report what this runner has' step"
          echo "above for what is actually installed."
          echo
          echo "Options:"
          echo "  * build the .app on a Mac with Xcode 26 (macapp/build.sh)"
          echo "    and upload CampusCaptions.zip to the release by hand"
          echo "  * re-run this workflow from the Actions tab with"
          echo "    'Build the macOS app even if the Swift speech helper"
          echo "    will not compile' ticked, accepting that apple_speech"
          echo "    will not work in that build"
          exit 1

      - name: Build the app
        run: macapp/build.sh --skip-helper

      - name: Check the build is not obviously broken
        run: |
          app="macapp/dist/Campus Captions.app"
          test -d "$app" || { echo "PyInstaller produced no $app"; exit 1; }
          test -x "$app/Contents/MacOS/Campus Captions" || {
            echo "no executable inside $app"; exit 1; }
          codesign --verify --strict "$app" || {
            echo "the bundle is not validly signed"; exit 1; }
          .venv/bin/python3 tools/macos_build_check.py

      - name: Zip the app
        # ditto, not `zip`: it is what preserves the bundle's symlinks,
        # resource forks and signature. A zip made any other way arrives on
        # someone else's Mac with a broken signature and no way past
        # Gatekeeper. --keepParent so unzipping yields the .app rather than
        # its contents loose in the Downloads folder.
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "macapp/dist/Campus Captions.app" macapp/dist/CampusCaptions.zip
          ls -lh macapp/dist/CampusCaptions.zip

      - name: Upload the app as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCaptions-macOS
          path: macapp/dist/CampusCaptions.zip
          if-no-files-found: error

      - name: Attach the app to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: macapp/dist/CampusCaptions.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
