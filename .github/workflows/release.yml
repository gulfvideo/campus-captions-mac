# Builds the downloadable apps and attaches them to the GitHub release for
# the tag that triggered it.
#
# This exists because the project has no build machine it can rely on for
# either platform. A release is cut by pushing a v* tag; some minutes later
# the Releases page carries a Windows installer and a macOS zip that a
# volunteer can download and double-click, with no Python, no Xcode and no
# checkout anywhere in the story.
#
# The two jobs are independent on purpose: no `needs:` between them, so a
# macOS runner without the SDK the Swift speech helper wants cannot stop the
# Windows installer from reaching the release, and vice versa.
#
# Run it by hand from the Actions tab (workflow_dispatch) to test a build
# without cutting a release - that path uploads each app as a workflow
# artifact and creates no release.

name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos_allow_missing_helper:
        description: >-
          Build the macOS app even if the Swift speech helper will not
          compile (apple_speech will not work in that build)
        type: boolean
        default: false

permissions:
  contents: write        # needed to attach the apps to the release

jobs:
  # ------------------------------------------------------------------ macOS
  macos:
    name: macOS app (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40

    strategy:
      # One architecture failing must not cancel the other: an Apple Silicon
      # build is worth shipping on its own, and the Intel runner is the one
      # on borrowed time (see below).
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: AppleSilicon
            whisper: true
          # macos-13 was retired in December 2025; macos-15-intel replaces it
          # and is GitHub's last x86_64 image, available until August 2027.
          # Worth carrying until then: PyInstaller freezes for the host
          # architecture, so an arm64 build does not launch at all on an Intel
          # Mac - Rosetta translates Intel to ARM, not the reverse. macOS 26
          # itself still runs on four Intel models (2019 16" MacBook Pro, 2020
          # 13" 4-port MacBook Pro, 2020 27" iMac, 2019 Mac Pro), so
          # apple_speech is reachable there too and the helper is still worth
          # building.
          - runner: macos-15-intel
            label: Intel
            # onnxruntime, which faster-whisper needs, ships no macOS x86_64
            # wheel for Python 3.14 - "from versions: none" - so this build
            # cannot carry Whisper at all and installing it fails the job
            # outright. Deepgram, Apple on-device speech and practice mode all
            # work; the app says Whisper is not included in this build rather
            # than offering it and failing, and rather than telling someone to
            # pip install into a frozen app.
            whisper: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Report what this runner has
        # capture/backends/native/speech_helper.swift is built against
        # SpeechAnalyzer, which is macOS 26 and Xcode 26. If the helper step
        # below fails, this is the step that says why in one glance rather
        # than leaving a swiftc error to be interpreted. The architecture is
        # printed for the same reason: it is what decides which Macs the
        # resulting app can launch on at all.
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          xcodebuild -version || true
          echo "--- Xcodes installed ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none beyond the selected one)"
          echo "--- macOS SDKs ---"
          xcodebuild -showsdks 2>/dev/null | grep -i macosx || true

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python3 -m pip install --upgrade pip
          .venv/bin/python3 -m pip install -r requirements.txt \
            -r macapp/requirements-build.txt
          if [ "${{ matrix.whisper }}" = "true" ]; then
            .venv/bin/python3 -m pip install -r requirements-whisper.txt
          else
            echo "skipping requirements-whisper.txt on ${{ matrix.label }}"
          fi

      - name: Byte-compile every module
        run: .venv/bin/python3 -m compileall -q relay capture launcher macapp tools

      - name: Select the newest Xcode
        # The image usually carries several and defaults to one of the older
        # ones. speech_helper.swift needs the macOS 26 SDK, so take the
        # highest version present rather than whatever xcode-select points at
        # - on the Intel runner the default had no SpeechAnalyzer at all and
        # the helper would not compile.
        run: |
          newest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            echo "selecting $newest"
            sudo xcode-select -s "$newest/Contents/Developer"
          else
            echo "only one Xcode on this runner; leaving the selection alone"
          fi
          xcodebuild -version
          xcodebuild -showsdks 2>/dev/null | grep -i macosx || true

      - name: Build the on-device speech helper
        # Built here rather than inside macapp/build.sh (which is told to
        # skip it below) so a too-old SDK is reported as this step, with the
        # explanation, instead of as a shell script that stopped.
        id: helper
        continue-on-error: true
        run: capture/backends/native/build.sh

      - name: Stop if the helper did not build
        # A build without the helper is a real degradation - apple_speech is
        # the free, private, no-account backend, and it is what a Mac on 26
        # would otherwise use - so this fails the job by default rather than
        # quietly publishing a crippled app.
        if: >-
          steps.helper.outcome == 'failure'
          && inputs.macos_allow_missing_helper != true
        run: |
          echo "::error::The Swift speech helper did not build on this runner."
          echo "speech_helper.swift needs the macOS 26 SDK (Xcode 26) for"
          echo "SpeechAnalyzer. See the 'Report what this runner has' step"
          echo "above for what is actually installed."
          echo
          echo "Options:"
          echo "  * build the .app on a Mac with Xcode 26 (macapp/build.sh)"
          echo "    and upload CampusCaptions.zip to the release by hand"
          echo "  * re-run this workflow from the Actions tab with"
          echo "    'Build the macOS app even if the Swift speech helper"
          echo "    will not compile' ticked, accepting that apple_speech"
          echo "    will not work in that build"
          exit 1

      - name: Build the app
        run: macapp/build.sh --skip-helper

      - name: Check the build is not obviously broken
        run: |
          app="macapp/dist/Campus Captions.app"
          test -d "$app" || { echo "PyInstaller produced no $app"; exit 1; }
          test -x "$app/Contents/MacOS/Campus Captions" || {
            echo "no executable inside $app"; exit 1; }
          codesign --verify --strict "$app" || {
            echo "the bundle is not validly signed"; exit 1; }
          .venv/bin/python3 tools/macos_build_check.py

      - name: Build the disk image
        # A .dmg rather than the .zip this project used to ship: opening it
        # and dragging one icon onto Applications is the gesture Mac users
        # already know, and it lands the app somewhere permanent. A zip
        # leaves the app loose in Downloads and makes "extract this first" a
        # step - the same step the Windows installer exists to remove.
        run: |
          version=$(.venv/bin/python3 -c "from launcher.version import VERSION; print(VERSION)")
          macapp/make_dmg.sh "macapp/dist/CampusCaptions-$version-${{ matrix.label }}.dmg"
          ls -lh macapp/dist/*.dmg

      - name: Check the disk image mounts and holds the app
        # hdiutil can produce an image that is valid but empty, and a release
        # asset nobody opened before publishing is how that gets discovered
        # by the person it was made for.
        run: |
          mnt=$(mktemp -d)
          hdiutil attach macapp/dist/*.dmg -nobrowse -readonly -mountpoint "$mnt"
          ls -l "$mnt"
          test -d "$mnt/Campus Captions.app" || { echo "no app in the image"; exit 1; }
          test -L "$mnt/Applications" || { echo "no Applications shortcut"; exit 1; }
          codesign --verify --strict "$mnt/Campus Captions.app" || {
            echo "the signature did not survive the copy into the image"; exit 1; }
          hdiutil detach "$mnt" -quiet
          echo "disk image is good"

      - name: Upload the app as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusCaptions-macOS-${{ matrix.label }}
          path: macapp/dist/*.dmg
          if-no-files-found: error

      - name: Attach the app to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: macapp/dist/*.dmg
          draft: false
          prerelease: true
          fail_on_unmatched_files: true

  # ------------------------------------------------------- update manifest
  # An installed copy checks one JSON document to learn whether a newer build
  # exists. The repository is private, so its release assets need a token to
  # download and no distributed app can safely carry one - a token in the
  # bundle is a token every tester can extract, and it would grant read access
  # to the whole repository. So the builds are copied to object storage the
  # project owns and the manifest points there instead. See relay/updater.py.
  #
  # Needs both platform jobs, unlike them needing each other: publishing a
  # manifest that names a build which failed would offer testers a download
  # that 404s. If either job fails, no manifest is published and everyone
  # stays on the version they have, which is the safe outcome.
  publish-update:
    name: Publish the update manifest
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Collect every built asset
        uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true      # all three land in one directory

      - name: Show what is being published
        run: ls -lh assets

      - name: Build latest.json from the real files
        # The size and SHA-256 are read off the bytes that were actually
        # built. A hand-written manifest is how you ship the previous
        # release's checksum and give every tester a failed verification.
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/publish_update.py \
            --assets assets \
            --base "${{ vars.UPDATE_BASE_URL }}" \
            --version "$version" \
            --notes "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body | head -c 3000)" \
            --out latest.json
          cat latest.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload the builds, then the manifest
        # Order matters: the manifest is what tells an app an update exists, so
        # it goes last. Published first, a tester who checked in that window
        # would be sent to a URL that does not exist yet.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          aws s3 cp assets "s3://$BUCKET/$version/" \
            --recursive --endpoint-url "$ENDPOINT" \
            --exclude "*" --include "*.dmg" --include "*.exe"
          aws s3 cp latest.json "s3://$BUCKET/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control "max-age=300"
          echo "published $version"
