# Cloudflare Tunnel example for Campus Captions.
#
# Copy to ~/.cloudflared/config.yml on the relay host and edit. This is an
# example, not a secret: the credentials file it points at is the secret, and
# that never belongs in this repo.
#
# Setup, once:
#   brew install cloudflared               # macOS
#   cloudflared tunnel login
#   cloudflared tunnel create campus-captions
#   cloudflared tunnel route dns campus-captions captions.school.edu
#   cloudflared tunnel run campus-captions
#
# The relay needs no inbound firewall rule: cloudflared makes an OUTBOUND
# connection to Cloudflare and traffic comes back down it.

tunnel: campus-captions
credentials-file: /Users/booth/.cloudflared/<TUNNEL-UUID>.json

# Ingress rules are evaluated in order; the first match wins. Only the audience
# side is published.
#
# This is defence in depth, not the only defence. The relay itself refuses the
# operator routes without the admin token when [site] mode = "public" - see
# config/event.example.toml. Do both: a rule here can be edited by mistake, and
# the relay should not depend on this file being right.
ingress:
  # --- the audience -------------------------------------------------------
  - hostname: captions.school.edu
    path: ^/phone$
    service: http://localhost:8000
  - hostname: captions.school.edu
    path: ^/qr$
    service: http://localhost:8000
  - hostname: captions.school.edu
    path: ^/ws/viewer
    service: http://localhost:8000
  - hostname: captions.school.edu
    path: ^/api/(site|languages|qr\.svg)$
    service: http://localhost:8000
  - hostname: captions.school.edu
    path: ^/robots\.txt$
    service: http://localhost:8000

  # --- everything else is not published -----------------------------------
  # /status, /tune, /api/status, /api/control and /ws/source stay reachable
  # only from the booth network. The operator is standing at the machine.
  - hostname: captions.school.edu
    service: http_status:404

  # required catch-all
  - service: http_status:404
